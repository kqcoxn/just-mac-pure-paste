  <path d="M802 127h12v12h-12zm0 0h-4a4 4 0 1 1 4-4zm12 0v-4a4 4 0 1 1 4 4zm0 12h4a4 4 0 1 1-4 4zm-12 0v4a4 4 0 1 1-4-4z" fill="none" stroke="#234f40" stroke-width="2"/>
