  <path d="M80 108h60M80 131h60M80 154h38" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#203b31">
    <text x="204" y="106" font-size="44" font-weight="700" letter-spacing="-1.4">Just Pure Paste</text>
    <text x="207" y="144" font-size="20" fill="#52675d">Keep the words. Leave the formatting.</text>
    <text x="207" y="188" font-size="13" font-weight="600" letter-spacing="2.3" fill="#62786b">A LITTLE UTILITY FOR macOS</text>
  </g>
