<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Just Pure Paste</title>
  <desc id="desc">A clipboard with plain text and the Shift Command V shortcut.</desc>
